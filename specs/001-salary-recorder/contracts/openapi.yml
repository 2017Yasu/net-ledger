          minimum: 0
        overtimeAllowance:
          type: number
          format: float
          minimum: 0
        commutingAllowance:
          type: number
          format: float
          minimum: 0
        otherAllowances:
          type: number
          format: float
          minimum: 0
        grossEarnings:
          type: number
          format: float
          minimum: 0
        socialInsuranceContributions:
          type: number
          format: float
          minimum: 0
        taxableAmount:
          type: number
          format: float
          minimum: 0
        incomeTax:
          type: number
          format: float
          minimum: 0
        residentTax:
          type: number
          format: float
          minimum: 0
        otherTaxes:
          type: number
          format: float
          minimum: 0
        totalDeductions:
          type: number
          format: float
          minimum: 0
        netPay:
          type: number
          format: float
          minimum: 0
        yearEndTaxAdjustment:
          type: number
          format: float
          minimum: 0
        paidTimeOffDaysUsed:
          type: number
          format: float
          minimum: 0
        paidTimeOffDaysRemaining:
          type: number
          format: float
          minimum: 0

    SalaryRecordUpdateRequest:
      type: object
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
