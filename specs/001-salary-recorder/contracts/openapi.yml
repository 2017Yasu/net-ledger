openapi: 3.0.0
info:
  title: Salary Recorder API
  version: 1.0.0
  description: API for managing user authentication and monthly salary records.

servers:
  - url: http://localhost:3000/api
    description: Local Development Server

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Authenticate user and get a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User successfully logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Log out current user (invalidate token/session)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: User successfully logged out
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /salary:
    get:
      summary: Get all salary records for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: year
          schema:
            type: integer
          description: Filter records by year
        - in: query
          name: month
          schema:
            type: integer
          description: Filter records by month
      responses:
        '200':
          description: List of salary records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalaryRecordResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No salary records found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new salary record for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryRecordCreateRequest'
      responses:
        '201':
          description: Salary record successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryRecordResponse'
        '400':
          description: Invalid input or record for month/year already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /salary/{recordId}:
    parameters:
      - in: path
        name: recordId
        schema:
          type: string
          format: uuid
        required: true
        description: Unique identifier of the salary record
    get:
      summary: Get a specific salary record by ID for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Details of the salary record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryRecordResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (user does not own this record)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Salary record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a specific salary record by ID for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryRecordUpdateRequest'
      responses:
        '200':
          description: Salary record successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryRecordResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (user does not own this record)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Salary record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a specific salary record by ID for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Salary record successfully deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (user does not own this record)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Salary record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SalaryRecordCreateRequest:
      type: object
      required:
        - month
        - year
        - baseSalary
        - grossEarnings
        - netPay
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
        attendanceDays:
          type: number
          format: float
          minimum: 0
        daysWorked:
          type: number
          format: float
          minimum: 0
        regularOvertimeHours:
          type: number
          format: float
          minimum: 0
        lateNightOvertimeHours:
          type: number
          format: float
          minimum: 0
        workingHours:
          type: number
          format: float
          minimum: 0
        baseSalary:
